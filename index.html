<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magical Mirai 2026 – Lyric App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/textalive-app-api/dist/index.js"></script>

  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #042034;
      --dim:       #1a1a2e;
      --accent1:   #00ffe0;   /* teal-cyan  – active char color A */
      --accent2:   #ff6ef7;   /* pink       – active char color B */
      --accent3:   #ffe24b;   /* yellow     – active char color C */
      --muted:     rgba(255,255,255,0.18);
      --line-gap:  1.7rem;    /* ~1-2 cm between lyric lines */
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      font-family: 'Zen Kaku Gothic New', sans-serif;
    }

    /* ── Particle canvas (background) ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.45;
    }

    /* ── Lyrics stage ── */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 6vw 90px;
      gap: var(--line-gap);
      pointer-events: none;
    }

    /* one lyric phrase row */
    .phrase-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.05em;
      line-height: 1;
      overflow: hidden;
    }

    /* ── inactive phrase ── */
    .phrase-row.inactive {
      font-size: clamp(0.9rem, 1.6vw, 1.3rem);
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── active phrase ── */
    .phrase-row.active {
      font-size: clamp(2.8rem, 7vw, 6rem);
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    /* each character span */
    .char {
      display: inline-block;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* active chars: slide in from left */
    .phrase-row.active .char.enter {
      animation: charSlideIn 0.22s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes charSlideIn {
      from { opacity: 0; transform: translateX(-28px) scale(0.7); }
      to   { opacity: 1; transform: translateX(0)    scale(1);   }
    }

    /* inactive chars: rise from below */
    .phrase-row.inactive .char.enter {
      animation: charRiseIn 0.3s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes charRiseIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* exit: fade down */
    .char.exit {
      animation: charExit 0.18s ease-in forwards !important;
    }
    @keyframes charExit {
      to { opacity: 0; transform: translateY(10px); }
    }

    /* active char colors cycle */
    .phrase-row.active .char:nth-child(3n+1) { color: var(--accent1); text-shadow: 0 0 18px var(--accent1); }
    .phrase-row.active .char:nth-child(3n+2) { color: var(--accent2); text-shadow: 0 0 18px var(--accent2); }
    .phrase-row.active .char:nth-child(3n)   { color: var(--accent3); text-shadow: 0 0 18px var(--accent3); }

    /* ── Controls bar ── */
    #controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      padding: 0.9rem 2rem;
      background: rgba(6,6,14,0.82);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    #song-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.65);
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .ctrl-btn {
      background: none;
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .ctrl-btn:hover {
      border-color: var(--accent1);
      background: rgba(0,255,224,0.08);
      transform: scale(1.08);
    }
    .ctrl-btn svg { width: 16px; height: 16px; fill: currentColor; }

    #btn-play { width: 52px; height: 52px; border-color: rgba(255,255,255,0.35); }
    #btn-play svg { width: 20px; height: 20px; }
    #btn-play:hover { border-color: var(--accent2); background: rgba(255,110,247,0.1); }

    /* progress bar */
    #progress-wrap {
      flex: 1;
      max-width: 300px;
      height: 3px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      border-radius: 2px;
      transition: width 0.25s linear;
      pointer-events: none;
    }

    /* loading overlay */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      transition: opacity 0.5s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 2.5px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent1);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #overlay p {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.5);
    }

    /* song selector dots */
    #song-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .dot.active-dot {
      background: var(--accent1);
      transform: scale(1.3);
    }
  </style>
</head>
<body>

<!-- background particle canvas -->
<canvas id="bg-canvas"></canvas>

<!-- lyric stage -->
<div id="stage"></div>

<!-- loading overlay -->
<div id="overlay">
  <div class="spinner"></div>
  <p>LOADING SONG…</p>
</div>

<!-- controls -->
<div id="controls">
  <!-- prev -->
  <button class="ctrl-btn" id="btn-prev" title="Previous">
    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
  </button>

  <!-- play/pause -->
  <button class="ctrl-btn" id="btn-play" title="Play/Pause">
    <svg id="ico-play"  viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="ico-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
  </button>

  <!-- next -->
  <button class="ctrl-btn" id="btn-next" title="Next">
    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
  </button>

  <!-- song title -->
  <div id="song-title">–</div>

  <!-- progress -->
  <div id="progress-wrap">
    <div id="progress-fill"></div>
  </div>

  <!-- dots -->
  <div id="song-dots"></div>
</div>

<script>
/* ══════════════════════════════════════════
   SONGS
══════════════════════════════════════════ */
const SONGS = [
  {
    title: "こたえて / imie",
    url: "https://piapro.jp/t/6W2N/20251215164617",
    video: { beatId: 4827293, chordId: 2963754, repetitiveSegmentId: 3086261, lyricId: 126519, lyricDiffId: 28645 }
  },
  {
    title: "アフター・ザ・カーテン / Rulmry.",
    url: "https://piapro.jp/t/zoqO/20251214200738",
    video: { beatId: 4827294, chordId: 2963755, repetitiveSegmentId: 3086262, lyricId: 126591, lyricDiffId: 28627 }
  },
  {
    title: "シャッターチャンス / 夜未アガリ",
    url: "https://piapro.jp/t/PNpQ/20251209170719",
    video: { beatId: 4827295, chordId: 2963756, repetitiveSegmentId: 3086263, lyricId: 126542, lyricDiffId: 28628 }
  },
  {
    title: "世界最後の音楽隊 / 夏山よつぎ×ど～ぱみん",
    url: "https://piapro.jp/t/B3yJ/20251215061727",
    video: { beatId: 4827296, chordId: 2963757, repetitiveSegmentId: 3086264, lyricId: 126594, lyricDiffId: 28629 }
  },
  {
    title: "トリツクロジー / 鶴三",
    url: "https://piapro.jp/t/QBdL/20251215094303",
    video: { beatId: 4827297, chordId: 2963758, repetitiveSegmentId: 3086265, lyricId: 126593, lyricDiffId: 28630 }
  },
  {
    title: "TAKEOVER / Twinfield",
    url: "https://piapro.jp/t/E2i3/20251215092113",
    video: { beatId: 4827298, chordId: 2963759, repetitiveSegmentId: 3086266, lyricId: 126533, lyricDiffId: 28631 }
  },
];

const TOKEN = "6q5ihGBYOXCKd4ri";

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let currentSong  = 0;
let isPlaying    = false;
let player       = null;
let currentPhrase = null;

/* ══════════════════════════════════════════
   DOM refs
══════════════════════════════════════════ */
const stage       = document.getElementById("stage");
const overlay     = document.getElementById("overlay");
const overlayTxt  = overlay.querySelector("p");
const btnPlay     = document.getElementById("btn-play");
const icoPlay     = document.getElementById("ico-play");
const icoPause    = document.getElementById("ico-pause");
const songTitle   = document.getElementById("song-title");
const progressFill= document.getElementById("progress-fill");
const dotsWrap    = document.getElementById("song-dots");

/* ══════════════════════════════════════════
   SONG DOTS
══════════════════════════════════════════ */
SONGS.forEach((_, i) => {
  const d = document.createElement("div");
  d.className = "dot" + (i === 0 ? " active-dot" : "");
  d.addEventListener("click", () => loadSong(i));
  dotsWrap.appendChild(d);
});

function updateDots() {
  [...dotsWrap.children].forEach((d, i) =>
    d.classList.toggle("active-dot", i === currentSong));
}

/* ══════════════════════════════════════════
   PARTICLE BACKGROUND
══════════════════════════════════════════ */
(function initParticles() {
  const canvas = document.getElementById("bg-canvas");
  const ctx    = canvas.getContext("2d");
  let W, H, particles;

  const COLORS = ["#00ffe0","#ff6ef7","#ffe24b","#a0c4ff"];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.8 + 0.4,
      dx: (Math.random() - 0.5) * 0.3,
      dy: (Math.random() - 0.5) * 0.3,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      alpha: Math.random() * 0.6 + 0.2,
    };
  }

  function init() {
    resize();
    particles = Array.from({ length: 120 }, makeParticle);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0 || p.x > W) p.dx *= -1;
      if (p.y < 0 || p.y > H) p.dy *= -1;
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", resize);
  init();
  draw();
})();

/* ══════════════════════════════════════════
   LYRIC RENDERING
══════════════════════════════════════════ */

// Build a phrase row DOM element
function buildPhraseRow(text, isActive) {
  const row = document.createElement("div");
  row.className = "phrase-row " + (isActive ? "active" : "inactive");
  row.dataset.text = text;

  [...text].forEach((ch, i) => {
    const span = document.createElement("span");
    span.className = "char";
    span.textContent = ch === " " ? "\u00a0" : ch;
    // stagger delay per character
    span.style.animationDelay = (i * 0.028) + "s";
    row.appendChild(span);
  });
  return row;
}

// Trigger enter animation on all chars in a row
function animateIn(row) {
  [...row.querySelectorAll(".char")].forEach(c => c.classList.add("enter"));
}

// Trigger exit animation then remove
function animateOut(row, cb) {
  const chars = [...row.querySelectorAll(".char")];
  chars.forEach(c => { c.classList.remove("enter"); c.classList.add("exit"); });
  const dur = 200; // ms
  setTimeout(() => { row.remove(); if (cb) cb(); }, dur);
}

// Clear all rows
function clearStage() {
  [...stage.children].forEach(r => r.remove());
}

/* Called when a new phrase becomes active */
function renderPhrase(phrase) {
  if (!phrase) return;
  clearStage();

  // We'll show: 1 prev phrase (dim) + current (big) + 1 next phrase (dim)
  const prev = phrase.previous;
  const next = phrase.next;

  if (prev) {
    const row = buildPhraseRow(prev.text, false);
    stage.appendChild(row);
    animateIn(row);
  }

  const activeRow = buildPhraseRow(phrase.text, true);
  stage.appendChild(activeRow);
  animateIn(activeRow);

  if (next) {
    const row = buildPhraseRow(next.text, false);
    stage.appendChild(row);
    animateIn(row);
  }
}

/* ══════════════════════════════════════════
   TEXTALIVE PLAYER
══════════════════════════════════════════ */
function initPlayer() {
  if (player) {
    player.dispose();
    player = null;
  }

  player = new TextAliveApp.Player({
    app: { token: TOKEN },
    mediaElement: createMediaEl(),
  });

  player.addListener({
    onAppReady(app) {
      if (!app.songUrl) {
        player.createFromSongUrl(SONGS[currentSong].url, {
          video: SONGS[currentSong].video
        });
      }
    },

    onVideoReady() {
      overlayTxt.textContent = "LOADING AUDIO…";
    },

    onTimerReady() {
      overlay.classList.add("hidden");
      songTitle.textContent = SONGS[currentSong].title;
    },

    onPlay()  { setPlayState(true);  },
    onPause() { setPlayState(false); },
    onStop()  { setPlayState(false); clearStage(); progressFill.style.width = "0%"; currentPhrase = null; },

    onTimeUpdate(pos) {
      // update progress bar
      if (player.video && player.video.duration) {
        progressFill.style.width = ((pos / player.video.duration) * 100).toFixed(2) + "%";
      }

      // phrase tracking via player.video.findPhrase
      if (!player.video) return;
      const phrase = player.video.findPhrase(pos);
      if (phrase && phrase !== currentPhrase) {
        currentPhrase = phrase;
        renderPhrase(phrase);
      }
      // clear when no phrase is active
      if (!phrase && currentPhrase) {
        currentPhrase = null;
        clearStage();
      }
    },

    onError(msg) {
      console.error("TextAlive error:", msg);
      overlayTxt.textContent = "ERROR: " + msg;
    },
  });
}

function createMediaEl() {
  let el = document.getElementById("__ta_media__");
  if (el) el.remove();
  el = document.createElement("div");
  el.id = "__ta_media__";
  el.style.cssText = "position:fixed;bottom:80px;right:16px;z-index:9;width:220px;";
  document.body.appendChild(el);
  return el;
}

/* ══════════════════════════════════════════
   SONG LOADING
══════════════════════════════════════════ */
function loadSong(index) {
  currentSong   = index;
  currentPhrase = null;
  isPlaying     = false;
  clearStage();
  setPlayState(false);
  progressFill.style.width = "0%";
  overlay.classList.remove("hidden");
  overlayTxt.textContent = "LOADING SONG…";
  songTitle.textContent  = "–";
  updateDots();
  initPlayer();
}

/* ══════════════════════════════════════════
   CONTROLS
══════════════════════════════════════════ */
function setPlayState(playing) {
  isPlaying = playing;
  icoPlay.style.display  = playing ? "none"  : "";
  icoPause.style.display = playing ? ""      : "none";
}

btnPlay.addEventListener("click", () => {
  if (!player) return;
  if (isPlaying) player.requestPause();
  else           player.requestPlay();
});

document.getElementById("btn-prev").addEventListener("click", () => {
  loadSong((currentSong - 1 + SONGS.length) % SONGS.length);
});

document.getElementById("btn-next").addEventListener("click", () => {
  loadSong((currentSong + 1) % SONGS.length);
});

document.getElementById("progress-wrap").addEventListener("click", (e) => {
  if (!player || !player.data || !player.data.song) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  player.requestMediaSeek(ratio * player.data.song.duration);
});

/* ══════════════════════════════════════════
   BOOT
══════════════════════════════════════════ */
loadSong(0);
</script>
</body>
</html>
